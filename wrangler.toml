# ｍやるゼ！ API（medadapt-api-v2）。本体は assets/worker_v7_complete.js
name = "medadapt-api-v2"
main = "assets/worker_v7_complete.js"
compatibility_date = "2026-04-14"
# 変数・シークレットは Cloudflare 側の値を残す（deploy --keep-vars）
[[d1_databases]]
binding = "DB"
database_name = "medadapt-db"
database_id = "f9e88ff6-ce55-436a-bd5f-baf9ea902121"
[[services]]
binding = "ADAPT_SVC"
service = "adapt-api"
[observability]
enabled = true
