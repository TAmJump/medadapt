name: Deploy Worker (medadapt-api-v2)

on:
  push:
    branches: [main]
    paths:
      - 'assets/worker_v7_complete.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy medadapt-api-v2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b9de28abfd009bbf696ceec4da62c5b8
          wranglerVersion: "4"
          command: deploy --keep-vars
